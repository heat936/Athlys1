name: Fast PR verification and manual Spec Kit audit

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "test/**"
      - "tests/**"
      - "specs/**"
      - ".specify/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fast Node tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run component tests
        run: node --test
      - name: Set up uv for the manual CLI audit
        if: github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@v5
      - name: Install and audit the official Spec Kit CLI
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@979b0a3c1277283371c9901ad0eed04b64a99997
          specify --version
          specify check
          specify --help
          specify init --help
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cd "$tmpdir"
          specify init . --non-interactive --ignore-agent-tools
          test -d .specify
          test -n "$(find .specify -maxdepth 3 -type f -print -quit)"
      - name: Record source identity
        run: |
          printf 'repository=%s\n' "$GITHUB_REPOSITORY"
          printf 'commit=%s\n' "$GITHUB_SHA"
