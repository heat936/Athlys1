name: Athlys — consolidated CI

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "test/**"
      - "tests/**"
      - "specs/**"
      - ".specify/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athlys-consolidated-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator-tests:
    name: Athlys1 orchestrator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run orchestrator tests
        run: node --test

  consolidated-tests:
    needs: orchestrator-tests
    if: ${{ vars.ATHLYS_CI_READY == 'true' }}
    name: Six-component test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout Athlys1
        uses: actions/checkout@v4
        with:
          repository: heat936/Athlys1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'spec/ci-independence-bootstrap' }}
          path: components/Athlys1
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout Athlys2
        uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: spec/ci-independence-bootstrap
          path: components/Athlys2
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout Athlys3
        uses: actions/checkout@v4
        with:
          repository: heat936/Athlys3
          ref: spec/ci-independence-bootstrap
          path: components/Athlys3
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout Athlys4
        uses: actions/checkout@v4
        with:
          repository: heat936/Athlys4
          ref: spec/ci-independence-bootstrap
          path: components/Athlys4
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout Athlys5
        uses: actions/checkout@v4
        with:
          repository: heat936/Athlys5
          ref: spec/ci-independence-bootstrap
          path: components/Athlys5
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout Athlys6
        uses: actions/checkout@v4
        with:
          repository: heat936/Athlys6
          ref: spec/ci-independence-bootstrap
          path: components/Athlys6
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all component tests on one runner
        shell: bash
        run: |
          set -euo pipefail
          for repo in Athlys1 Athlys2 Athlys3 Athlys4 Athlys5 Athlys6; do
            echo "::group::${repo} — source identity"
            git -C "components/${repo}" rev-parse HEAD
            echo "::endgroup::"
            echo "::group::${repo} — Node tests"
            (cd "components/${repo}" && node --test)
            echo "::endgroup::"
          done
      - name: Record consolidated source manifest
        shell: bash
        run: |
          set -euo pipefail
          for repo in Athlys1 Athlys2 Athlys3 Athlys4 Athlys5 Athlys6; do
            printf '%s ' "$repo"
            git -C "components/$repo" rev-parse HEAD
          done
